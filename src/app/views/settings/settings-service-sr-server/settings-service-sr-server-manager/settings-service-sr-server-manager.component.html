<div class="settings-service-sr-server-manager">
  <div class="settings-service-sr-server-body">
    <div class="form">
      <div class="form-item full">
        <div class="form-item-title">
          <div class="must">*</div>
          <div text-space-between suffix="：">服务器名称</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Name" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div class="must">*</div>
          <div text-space-between suffix="：" [keepword]="true">服务器ID</div>
        </div>
        <div class="form-item-value">
          <input type="text" [readOnly]="true" [(ngModel)]="model.Id" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div class="must">*</div>
          <div text-space-between suffix="：">协议类型</div>
        </div>
        <div class="form-item-value select-control">
          <select [(ngModel)]="model.ProtocolType">
            <option value="Howell">Howell</option>
          </select>
          <div class="please" *ngIf="!model.ProtocolType">请选择</div>
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div text-space-between suffix="：">用户名</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Username" autocomplete="off" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div text-space-between suffix="：">密码</div>
        </div>
        <div class="form-item-value">
          <input
            type="password"
            [(ngModel)]="model.Password"
            autocomplete="new-password"
          />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div class="must">*</div>
          <div text-space-between suffix="：">主机地址</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Addresses[0].IPAddress" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div class="must">*</div>
          <div text-space-between suffix="：">主机端口号</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Addresses[0].Port" />
        </div>
      </div>

      <div class="form-item">
        <div class="form-item-title">
          <div text-space-between suffix="：">RTSP端口</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Addresses[0].RtspPort" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div text-space-between suffix="：">RTMP端口</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Addresses[0].RtmpPort" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div text-space-between suffix="：">HTTP端口</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Addresses[0].HttpPort" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div text-space-between suffix="：">WebSocket</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Addresses[0].WsPort" />
        </div>
      </div>

      <div class="form-item full">
        <div class="form-item-title">
          <div text-space-between suffix="：">联网方式</div>
        </div>
        <div class="form-item-value checkbox-group">
          <mat-checkbox [(ngModel)]="model.Addresses[0].IsInternet">
            互联网
          </mat-checkbox>
          <mat-checkbox [(ngModel)]="model.Addresses[0].IsDefault">
            直连
          </mat-checkbox>
        </div>
      </div>
    </div>
  </div>
  <div class="settings-service-sr-server-foot">
    <div>
      <button title="服务器同步" class="same" (click)="on.sync()">
        <i class="mdi mdi-sync"></i>
      </button>
    </div>
    <div class="button-group">
      <button class="full" (click)="on.ok()">
        <i class="mdi mdi-check"></i> 确认
      </button>
      <button (click)="on.cancel()"><i class="mdi mdi-close"></i> 取消</button>
    </div>
    <div></div>
  </div>
</div>
