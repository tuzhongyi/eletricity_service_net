<div class="settings-service-subtitle-server">
  <div class="settings-service-subtitle-server-body" *ngIf="!!model">
    <div class="form">
      <div class="form-item">
        <div class="form-item-title">
          <div class="must">*</div>
          <div text-space-between suffix="：">服务器名称</div>
        </div>

        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Name" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div class="must">*</div>
          <div text-space-between suffix="：">主机地址</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Host" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div class="must">*</div>
          <div text-space-between suffix="：">端口号</div>
        </div>
        <div class="form-item-value select-control">
          <input type="text" [(ngModel)]="model.Port" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div text-space-between suffix="：">最大分析数</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.MaxChannelCount" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div text-space-between suffix="：">用户名</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Username" autocomplete="off" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div text-space-between suffix="：">密码</div>
        </div>
        <div class="form-item-value">
          <input
            type="password"
            [(ngModel)]="model.Password"
            autocomplete="new-password"
          />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div text-space-between suffix="：">描述</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Description" />
        </div>
      </div>
    </div>
  </div>

  <div class="settings-service-subtitle-server-foot">
    <button class="full" (click)="onok()">
      <i class="mdi mdi-check"></i> 确认
    </button>
    <button (click)="oncancel()"><i class="mdi mdi-close"></i> 取消</button>
  </div>
</div>
