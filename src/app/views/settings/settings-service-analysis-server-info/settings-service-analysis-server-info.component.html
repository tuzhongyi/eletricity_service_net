<div class="settings-service-analysis-server-info">
  <div class="form">
    <div class="form-item">
      <div class="form-item-title">
        <div class="must">*</div>
        <div text-space-between suffix="：">服务器名称</div>
      </div>
      <div class="form-item-value">
        <input type="text" [(ngModel)]="data.Name" />
      </div>
    </div>
    <div class="form-item">
      <div class="form-item-title">
        <div class="must">*</div>
        <div text-space-between suffix="：" [keepword]="true">服务器ID</div>
      </div>
      <div class="form-item-value">
        <input type="text" [readOnly]="true" [(ngModel)]="data.Id" />
      </div>
    </div>

    <div class="form-item">
      <div class="form-item-title">
        <div class="must">*</div>
        <div text-space-between suffix="：" [keepword]="true">Url地址</div>
      </div>
      <div class="form-item-value">
        <input type="text" [(ngModel)]="data.Url" />
      </div>
    </div>

    <div class="form-item">
      <div class="form-item-title">
        <div class="must">*</div>
        <div text-space-between suffix="：">协议类型</div>
      </div>
      <div class="form-item-value select-control">
        <select [(ngModel)]="data.ProtocolType">
          <option value="Howell">Howell</option>
        </select>
        <div class="please" *ngIf="!data.ProtocolType">请选择</div>
      </div>
    </div>

    <div class="form-item">
      <div class="form-item-title">
        <div class="must">*</div>
        <div text-space-between suffix="：">刷新间隔</div>
      </div>
      <div class="form-item-value">
        <input type="number" min="0" [(ngModel)]="data.Interval" />
      </div>
    </div>

    <div class="form-item">
      <div class="form-item-title">
        <div text-space-between suffix="：">用户名</div>
      </div>
      <div class="form-item-value">
        <input type="text" [(ngModel)]="data.Username" autocomplete="off" />
      </div>
    </div>

    <div class="form-item">
      <div class="form-item-title">
        <div text-space-between suffix="：">密码</div>
      </div>
      <div class="form-item-value">
        <input
          type="password"
          [(ngModel)]="data.Password"
          autocomplete="new-password"
        />
      </div>
    </div>

    <div class="form-item">
      <div class="form-item-title">
        <div text-space-between suffix="：">状态</div>
      </div>
      <div class="form-item-value">
        <div class="status">{{ status }}</div>
      </div>
    </div>
  </div>
</div>
