<div class="settings-service-passenger-server">
  <div class="settings-service-passenger-server-body">
    <div class="form">
      <div class="form-item">
        <div class="form-item-title">
          <div class="must">*</div>
          <div text-space-between suffix="：">服务器名称</div>
        </div>

        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Name" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-title">
          <div class="must">*</div>
          <div text-space-between suffix="：" [keepword]="true">服务器ID</div>
        </div>

        <div class="form-item-value">
          <input type="text" [readOnly]="true" [(ngModel)]="model.Id" />
        </div>
      </div>

      <div class="form-item">
        <div class="form-item-title">
          <div class="must">*</div>
          <div text-space-between suffix="：" [keepword]="true">Url地址</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Url" />
        </div>
      </div>

      <div class="form-item">
        <div class="form-item-title">
          <div class="must">*</div>
          <div text-space-between suffix="：">协议类型</div>
        </div>
        <div class="form-item-value select-control">
          <select [(ngModel)]="model.ProtocolType">
            <option
              [ngValue]="item.key"
              *ngFor="let item of source.protocol | keyvalue"
            >
              {{ item.value }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-item">
        <div class="form-item-title">
          <div class="must">*</div>
          <div text-space-between suffix="：">刷新间隔</div>
        </div>
        <div class="form-item-value">
          <input type="number" min="0" [(ngModel)]="model.Interval" />
        </div>
      </div>

      <div class="form-item">
        <div class="form-item-title">
          <div text-space-between suffix="：">用户名</div>
        </div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="model.Username" autocomplete="off" />
        </div>
      </div>

      <div class="form-item">
        <div class="form-item-title">
          <div text-space-between suffix="：">密码</div>
        </div>
        <div class="form-item-value">
          <input
            type="password"
            autocomplete="new-password"
            [(ngModel)]="model.Password"
          />
        </div>
      </div>

      <div class="form-item">
        <div class="form-item-title">
          <div text-space-between suffix="：">状态</div>
        </div>
        <div class="form-item-value">
          <div class="status">{{ language.status }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="settings-service-passenger-server-foot">
    <div>
      <button title="服务器同步" class="same" (click)="on.sync()">
        <i class="mdi mdi-sync"></i>
      </button>
    </div>
    <div class="button-group">
      <button class="full" (click)="on.ok()">
        <i class="mdi mdi-check"></i> 确认
      </button>
      <button (click)="on.cancel()"><i class="mdi mdi-close"></i> 取消</button>
    </div>
    <div></div>
  </div>
</div>
